<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IHACDP · Not found</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
<style>
.err{min-height:calc(100vh - var(--nav-h,63px));min-height:calc(100dvh - var(--nav-h,63px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:40px 16px}
.err .code{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em;
  color:var(--brand);background:var(--brand-soft);padding:6px 14px;border-radius:999px}
.err h1{font-size:clamp(28px,5vw,40px);margin-top:24px;letter-spacing:-.035em}
.err p{margin-top:12px;max-width:440px;color:var(--ink-3);font-size:16px;line-height:24px;text-wrap:pretty}
.err .cta{margin-top:32px}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="/"><img class="glyph" src="/assets/logo.png" alt="">IHACDP</a>
  <div class="nav-links">
    <a href="/models"><span class="nav-full">Model Performance</span><span class="nav-short">Models</span></a>
    <a href="/about">About</a>
    <a href="/consult" class="nav-cta">Try IHACDP</a>
  </div>
</div></nav>

<main class="err">
  <span class="code" id="code">404</span>
  <h1 id="title">We couldn't find that page</h1>
  <p id="detail">The link may be out of date, or the page may have moved.</p>
  <div class="cta">
    <a class="btn btn-primary" href="/consult">Start a consultation</a>
    <a class="btn btn-ghost" href="/">Go home</a>
  </div>
</main>

<script src="/js/nav.js"></script>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code');
if (code === '500') {
  document.getElementById('code').textContent = '500';
  document.title = 'IHACDP · Error';
  document.getElementById('title').textContent = 'Something went wrong on our side';
  document.getElementById('detail').textContent =
    'Something went wrong while handling that. Please try again in a moment.';
} else if (code === '503') {
  document.getElementById('code').textContent = '503';
  document.title = 'IHACDP · Unavailable';
  document.getElementById('title').textContent = 'IHACDP is temporarily unavailable';
  document.getElementById('detail').textContent =
    'We could not reach the assistant just now. Please try again shortly.';
}
</script>
</body></html>
